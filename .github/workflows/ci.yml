name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 前端索引（docs/frontend-index/）是否与源码一致。
      # 故意**不阻塞**：索引过期不影响构建产物，只是让 AI/人少读点代码；
      # 这里只留一条提醒，不因为忘了重新生成就红掉整条流水线。
      - name: Frontend index freshness (non-blocking)
        continue-on-error: true
        run: |
          if ! node scripts/gen-frontend-index.mjs --check; then
            echo "::warning title=前端索引过期::在仓库根运行 npm run index:frontend 重新生成，并与代码放在同一个提交里"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck
